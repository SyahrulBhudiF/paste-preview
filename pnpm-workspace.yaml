minimumReleaseAge: 10080
minimumReleaseAgeExclude:
    - "@isaacs/nonrecursive-glob-match"
    - minimatch
trustPolicy: no-downgrade
trustLockfile: true

trustPolicyExclude:
    - semver@6.3.1

overrides:
    minimatch@*: 11.0.1
    undici@*: 7.30.1
    vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
    vitest@*: 5.0.5

allowBuilds:
    "@parcel/watcher": true
    esbuild: true
    msgpackr-extract: true
    sharp: true
    workerd: true
